<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- magenta (top node) -> blue-cyan (bottom-left node) -->
    <linearGradient id="edgeLeft" x1="256" y1="140" x2="120" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <!-- magenta (top node) -> cyan (bottom-right node) -->
    <linearGradient id="edgeRight" x1="256" y1="140" x2="392" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="0" fill="#0a0a12"/>

  <!-- EDGES - gradients carrying all three colors -->
  <path d="M 256 140 L 120 370" stroke="url(#edgeLeft)" stroke-width="20" fill="none"/>
  <path d="M 256 140 L 392 370" stroke="url(#edgeRight)" stroke-width="20" fill="none"/>

  <!-- NODES -->
  <rect x="196" y="100" width="120" height="80" rx="14" fill="#ff00ff"/>
  <rect x="60" y="330" width="120" height="80" rx="14" fill="#00ccff"/>
  <rect x="332" y="330" width="120" height="80" rx="14" fill="#00ffcc"/>
</svg>
