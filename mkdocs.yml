site_name: Graph Core
site_description: Hierarchical node management with Vue 3 and Electron
site_author: Graph Core Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home:
    - Overview: index.md
    - Architecture: architecture/overview.md
    - Database: architecture/database.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: guides/quickstart.md
  - Guides:
    - Views: guides/views.md
    - AI Notes: guides/ai-notes.md
    - Workspaces: guides/workspaces.md
  - Reference:
    - Keyboard Shortcuts: reference/keyboard-shortcuts.md
    - Node Types: reference/node-types.md
    - Interactions: reference/interactions.md
    - Accessibility: reference/accessibility.md
  - Contributing:
    - Development: contributing/development.md
