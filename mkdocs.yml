site_name: Graph Core
site_description: Hierarchical node management with Vue 3 and Electron
site_author: Graph Core Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

# MkDocs builds every file under docs/, whether or not it is in the nav.
# REVIEW.md is an internal engineering report: keep it in the repo, off the site.
# (exclude_docs requires MkDocs >= 1.5; the Makefile installs the latest.)
exclude_docs: |
  REVIEW.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: guides/quickstart.md
  - Guides:
    - Views: guides/views.md
    - Detail Panel: guides/detail-panel.md
    - Linking Nodes: guides/linking.md
    - Drag and Drop: guides/drag-drop.md
    - Search: guides/search.md
    - Workspaces: guides/workspaces.md
    - Demo Workspace: guides/demo-workspace.md
    - AI Notes: guides/ai-notes.md
    - Import and Export: guides/import-export.md
  - Reference:
    - Node Types: reference/node-types.md
    - Keyboard Shortcuts: reference/keyboard-shortcuts.md
    - Interactions: reference/interactions.md
    - Settings: reference/settings.md
    - Accessibility: reference/accessibility.md
  - Architecture:
    - Overview: architecture/overview.md
    - Database: architecture/database.md
    - Caching: architecture/caching.md
  - Contributing:
    - Development: contributing/development.md
    - Standards: contributing/standards.md
