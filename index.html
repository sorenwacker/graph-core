<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Core</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      A build with no preload bridge refuses to start (src/services/api.ts).
      That throw happens while the module graph loads, before main.js runs, so
      nothing inside it can report the failure. Registering here first turns a
      blank window into a stated reason.
    -->
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('app')
        if (!root || root.childElementCount > 0) return
        root.setAttribute('role', 'alert')
        root.style.cssText =
          'font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
          'max-width:34rem;margin:12vh auto;padding:0 1.5rem;color:#161c21'
        var heading = document.createElement('h1')
        heading.style.cssText = 'font-size:1.25rem;margin:0 0 .6rem'
        heading.textContent = 'Graph Core could not start'
        var detail = document.createElement('p')
        detail.style.cssText = 'margin:0;color:#4d5a63'
        detail.textContent = (event.error && event.error.message) || 'The application failed to load.'
        root.replaceChildren(heading, detail)
      })
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
