name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Tests must pass before any release artifacts are built
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test:run

      - name: Verify build
        run: npm run build

  # Validate release type - full releases require existing prerelease
  validate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release type
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          # Check if this is a prerelease tag (contains -alpha, -beta, -rc, etc.)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a PRE-RELEASE: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a FULL RELEASE: $TAG"

            # Check if a prerelease exists for this version
            PRERELEASES=$(gh release list --limit 100 | grep -E "${VERSION}-(alpha|beta|rc)" || true)

            if [ -z "$PRERELEASES" ]; then
              echo "::error::No pre-release found for version $VERSION. Create a pre-release first (e.g., v${VERSION}-beta.1)"
              exit 1
            else
              echo "Found pre-releases for this version:"
              echo "$PRERELEASES"
            fi
          fi

  # Build release artifacts after validation
  build:
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Mark release as prerelease or full release and add install instructions
  finalize:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release type and add notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          NOTES="## Installation

          **macOS:** Open Terminal and run: \`xattr -cr /Applications/Graph\\ Core.app\` then open the app.

          **Windows:** Run the installer. Click \"More info\" then \"Run anyway\" if you see a SmartScreen warning.

          **Linux:** Make the AppImage executable: \`chmod +x Graph-Core-*.AppImage\`"

          if [ "${{ needs.validate.outputs.is_prerelease }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes "$NOTES"
            echo "Marked $TAG as pre-release"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --notes "$NOTES"
            echo "Marked $TAG as full release"
          fi

  # Upload release assets to R2 (full releases only)
  upload-r2:
    needs: [validate, build, finalize]
    if: needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets

      - name: Upload to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://78836246513c4e18ead5fd9349aea200.r2.cloudflarestorage.com
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

          # Generate index.html
          cat > assets/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>Graph Core Downloads</title>
          <style>body{font-family:system-ui;max-width:800px;margin:2rem auto;padding:1rem}
          a{display:block;padding:0.5rem 0}</style></head>
          <body><h1>Graph Core Downloads</h1>
          EOF
          for f in assets/*; do
            [ -f "$f" ] && echo "<a href=\"$(basename "$f")\">$(basename "$f")</a>" >> assets/index.html
          done
          echo "</body></html>" >> assets/index.html

          rclone copy assets/ r2:binaries/graph-core/
