name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Tests must pass before any release artifacts are built
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test:run

      - name: Verify build
        run: npm run build

  # Validate release type - full releases require existing prerelease
  validate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release type
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          # Check if this is a prerelease tag (contains -alpha, -beta, -rc, etc.)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a PRE-RELEASE: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a FULL RELEASE: $TAG"

            # Check if a prerelease exists for this version
            PRERELEASES=$(gh release list --limit 100 | grep -E "^v${VERSION}-(alpha|beta|rc)" || true)

            if [ -z "$PRERELEASES" ]; then
              echo "::error::No pre-release found for version $VERSION. Create a pre-release first (e.g., v${VERSION}-beta.1)"
              exit 1
            else
              echo "Found pre-releases for this version:"
              echo "$PRERELEASES"
            fi
          fi

  # Build release artifacts after validation
  build:
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On macOS: allow ad-hoc signing (gives "unidentified developer" warning instead of "damaged" error)
          # On Windows/Linux: disable signing auto-discovery
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}

  # Mark release as prerelease or full release and add install instructions
  finalize:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release type and add notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          NOTES="## Installation

          **macOS:** Right-click the app and select \"Open\", then click \"Open\" in the dialog. You can also go to System Settings > Privacy & Security and click \"Open Anyway\".

          **Windows:** Run the installer. You may see a SmartScreen warning - click \"More info\" then \"Run anyway\".

          **Linux:** Make the AppImage executable: \`chmod +x Graph-Core-*.AppImage\`"

          if [ "${{ needs.validate.outputs.is_prerelease }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes "$NOTES"
            echo "Marked $TAG as pre-release"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --notes "$NOTES"
            echo "Marked $TAG as full release"
          fi
