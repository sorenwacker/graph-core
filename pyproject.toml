[project]
name = "graph-core"
version = "0.1.0"
description = "Unified node-based graph data structure with tree hierarchy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "typer>=0.21.1",
    "uvicorn>=0.40.0",
]

[project.scripts]
graph = "graph_core.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_core"]
